# Canonical local stack: one shared application image, durable WARC and local S3.
# Existing external deployments must be migrated separately with their data preserved.
x-app: &app
  image: crawler-api:local
  pull_policy: never
  entrypoint: ["python", "scripts/stack_s3_runtime.py"]
  init: true

x-app-env: &app-env
  REDIS_URL: redis://redis:6379/2
  ARQ_REDIS_URL: redis://redis:6379/2
  ENABLE_WARC: "true"
  S3_ENDPOINT_URL: http://s3:9000
  S3_BUCKET: crawler-warc
  S3_REGION: us-east-1
  WARC_DLQ_DIR: /var/lib/crawler/warc-spool
  WARC_DLQ_MAX_BYTES: "5368709120"
  ENABLE_CALLBACKS: "false"
  ENABLE_TRACING: "false"
  ENABLE_PREMIUM_PROXY_TIERS: "${ENABLE_PREMIUM_PROXY_TIERS:-false}"
  PREMIUM_PROXY_DOMAINS: "${PREMIUM_PROXY_DOMAINS:-}"
  # A blocked site can take two attempts on each of three engines, browsers included.
  WORKER_JOB_TIMEOUT_S: "${WORKER_JOB_TIMEOUT_S:-400}"
  BROWSER_NATIVE_TRANSPORT: "${BROWSER_NATIVE_TRANSPORT:-1}"
  BROWSER_CHALLENGE_WAIT_S: "${BROWSER_CHALLENGE_WAIT_S:-20}"
  PROXY_CHECK_ENABLED: "true"
  PROXY_CHECK_TIMEOUT_S: "${PROXY_CHECK_TIMEOUT_S:-5}"
  PROXY_CHECK_CONCURRENCY: "${PROXY_CHECK_CONCURRENCY:-50}"
  PROXY_CHECK_BATCH_SIZE: "${PROXY_CHECK_BATCH_SIZE:-250}"
  PROXY_SYNC_ENABLED: "${PROXY_SYNC_ENABLED:-false}"
  ENABLE_DOMAIN_POLICIES: "${ENABLE_DOMAIN_POLICIES:-true}"
  WEBSHARE_API_KEY: "${WEBSHARE_API_KEY:-}"
  REQUIRE_CAMOUFOX: "true"
  SSRF_ENABLED: "true"
  WORKER_MAX_JOBS: "${WORKER_MAX_JOBS:-2}"
  BROWSER_POOL_SIZE: "1"
  MOZ_DISABLE_CONTENT_SANDBOX: "1"

services:
  secrets:
    <<: *app
    user: "0:0"
    command: ["secrets"]
    restart: "no"
    volumes:
      - runtime-secrets:/run/crawler-secrets
      - s3-secrets:/run/crawler-s3
      - s3-data:/var/lib/crawler-s3
      - warc-spool:/var/lib/crawler/warc-spool
    healthcheck:
      disable: true

  s3:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY_FILE: /run/crawler-s3/access_key
      RUSTFS_SECRET_KEY_FILE: /run/crawler-s3/secret_key
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /data/logs
    volumes:
      - s3-data:/data
      - s3-secrets:/run/crawler-s3:ro
    ports:
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    depends_on:
      secrets:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: crawler
      POSTGRES_DB: crawler
      POSTGRES_PASSWORD_FILE: /run/crawler-secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - runtime-secrets:/run/crawler-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  initialize:
    <<: *app
    command: ["initialize"]
    environment: *app-env
    volumes:
      - runtime-secrets:/run/crawler-secrets
      - s3-secrets:/run/crawler-s3:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    build:
      context: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    volumes:
      - runtime-secrets:/run/crawler-secrets:ro
      - s3-secrets:/run/crawler-s3:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *app
    command: ["arq", "app.worker.arq_worker.WorkerSettings"]
    environment: *app-env
    volumes:
      - runtime-secrets:/run/crawler-secrets:ro
      - s3-secrets:/run/crawler-s3:ro
      - warc-spool:/var/lib/crawler/warc-spool
    depends_on:
      initialize:
        condition: service_completed_successfully
    shm_size: 1gb
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "scripts/stack_runtime.py", "arq", "--check", "app.worker.arq_worker.WorkerSettings"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  runtime-secrets:
  s3-data:
  s3-secrets:
  warc-spool:

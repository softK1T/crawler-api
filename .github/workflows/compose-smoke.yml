name: Fresh Compose startup

on:
  push:
    branches: [master, interview-stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-start:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline runtime tests
        run: python -m unittest discover -s tests -p test_stack_runtime.py -v
      - name: Build and start from repository only
        run: docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Verify readiness, credentials, migration and candidate pool API
        shell: bash
        run: |
          set -euo pipefail
          dc() { docker compose -f docker-compose.yml "$@"; }
          KEY=$(dc exec -T api python scripts/stack_runtime.py key)
          echo "::add-mask::$KEY"
          curl -fsS http://127.0.0.1:8000/readyz | jq -e '.status == "ready" and .checks.playwright == "ok" and .checks.camoufox == "ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/keys)" = 401
          curl -fsS -H "X-API-Key: $KEY" http://127.0.0.1:8000/v1/keys | jq -e 'length == 1'
          curl -fsS -X POST http://127.0.0.1:8000/admin/proxy-pools -H "X-API-Key: $KEY" -H 'Content-Type: application/json' -d '{"name":"ci-candidates","provider":"public-candidates"}' | jq -e '.provider == "public-candidates"'
          dc exec -T api python scripts/stack_runtime.py alembic current | grep '0009'
          dc run --rm --no-deps -T --interactive=false initialize </dev/null
          KEY_AGAIN=$(dc exec -T api python scripts/stack_runtime.py key)
          echo "::add-mask::$KEY_AGAIN"
          test "$KEY" = "$KEY_AGAIN"
          dc exec -T api python scripts/stack_runtime.py alembic current | grep '0009'
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color --tail=100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans

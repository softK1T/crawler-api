name: CI

on:
  push:
    branches: [main, master, dev, interview-stable, "stage-*"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation level
        type: choice
        options: [fast, full]
        default: fast

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
      integration: ${{ steps.scope.outputs.integration }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: node --test .github/ci-plan.test.cjs
      - id: scope
        uses: actions/github-script@v7
        with:
          script: await require('./.github/ci-plan.cjs').run({ context, github, core });

  fast:
    name: Fast code checks
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:1/testdb
      REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install ruff
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - run: python -m pip install -r requirements-dev.txt
      - run: mypy app/ tests/
      - name: Tests without live services
        run: python -m pytest -p scripts.ci_test_selection --ci-unit-only -m "not slow" --maxfail=1 -q

  integration:
    name: Service integration tests
    needs: [plan, fast]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawlerdb
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U crawler -d crawlerdb" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - name: Existing complete non-slow suite, including mixed legacy unit tests
        run: python -m pytest -m "not slow" --maxfail=1 -q
        env:
          DATABASE_URL: postgresql+asyncpg://crawler:crawler@localhost:5432/crawlerdb
          REDIS_URL: redis://localhost:6379/0
          TEST_DATABASE_URL: postgresql+asyncpg://crawler:crawler@localhost:5432/crawlerdb
          TEST_REDIS_URL: redis://localhost:6379/0

  docker:
    name: Docker build and startup
    needs: [plan, fast, integration]
    if: >-
      !cancelled() && needs.plan.outputs.docker == 'true' &&
      needs.fast.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    uses: ./.github/workflows/compose-smoke.yml

  gate:
    name: CI gate
    needs: [plan, fast, integration, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const n = JSON.parse(process.env.NEEDS_JSON);
            if (n.plan.result !== 'success') {
              core.setFailed('CI scope selection failed');
              return;
            }
            const required = { fast: 'code', integration: 'integration', docker: 'docker' };
            for (const [job, flag] of Object.entries(required)) {
              if (n.plan.outputs[flag] === 'true' && n[job].result !== 'success') {
                core.setFailed(`${job}: ${n[job].result}`);
              }
            }

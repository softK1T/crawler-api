# Standalone Ubuntu configuration; do not combine with docker-compose.yml.
# Build CRAWLER_IMAGE separately before starting services.
# Required: POSTGRES_PASSWORD (use a long random hexadecimal value).
# Optional: CRAWLER_IMAGE, API_PORT.
# Keep real credentials outside Git.

x-app-env: &app-env
  DATABASE_URL: "postgresql+asyncpg://crawler:${POSTGRES_PASSWORD:?}@postgres:5432/crawler"
  REDIS_URL: "redis://redis:6379/2"
  ARQ_REDIS_URL: "redis://redis:6379/2"
  ENABLE_WARC: "false"
  ENABLE_CALLBACKS: "false"
  ENABLE_PREMIUM_PROXY_TIERS: "false"
  PROXY_SYNC_ENABLED: "false"
  ENABLE_TRACING: "false"
  ENABLE_METRICS: "true"
  REQUIRE_CAMOUFOX: "true"
  SSRF_ENABLED: "true"
  WORKER_MAX_JOBS: "2"
  BROWSER_POOL_SIZE: "1"
  WORKER_JOB_TIMEOUT_S: "120"
  LOG_LEVEL: "INFO"

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: crawler
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  api:
    image: "${CRAWLER_IMAGE:-crawler-api:interview-ubuntu-check}"
    pull_policy: never
    init: true
    environment: *app-env
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m

  worker:
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.arq_worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    image: "${CRAWLER_IMAGE:-crawler-api:interview-ubuntu-check}"
    pull_policy: never
    init: true
    environment: *app-env
    entrypoint: ["arq"]
    command: ["app.worker.arq_worker.WorkerSettings"]
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2.0
    stop_grace_period: 45s

volumes:
  postgres-data:
  redis-data:

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "alembic*"]

[project]
name = "crawler-api"
version = "0.1.0"
description = "Crawler-as-a-service platform for internal scraping projects"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx[http2]>=0.27.0",
    "redis>=5.0.1",
    "starlette>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "html2text>=2024.2.26",
    "curl-cffi>=0.7.0",
    "argon2-cffi>=23.1.0",
    "tldextract>=5.1.0",
    "warcio>=1.7.4",
    "aioboto3>=13.0",
    "arq>=0.25.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "greenlet>=3.0.0",
    "brotli>=1.1.0",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
browser = [
    "playwright==1.49.0",
    "camoufox[geoip]>=0.4.0",
]
test = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "psycopg2-binary>=2.9.9",
]
dev = [
    "crawler-api[test]",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "alembic/versions", ".idea", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit — security lint matters for a crawler
    "DTZ",  # flake8-datetimez — naive datetimes cause silent TZ bugs
    "ASYNC",# flake8-async — blocking calls in async code
    "RUF",
]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ASYNC240"]  # asserts, dummy credentials, and pathlib in tests are expected
"__init__.py" = ["F401"]
"app/core/logging_config.py" = ["S110"]  # intentional try-except-pass in redaction filter
"app/services/proxy_manager.py" = ["S311", "S110"]  # random for weighted selection (non-crypto); intentional try-except-pass on sticky delete
"app/services/fetchers/base.py" = ["S311"]  # random.uniform for jittered delay (non-crypto)
"app/services/fetchers/headers.py" = ["S311"]  # random.choice for UA rotation (non-crypto)
"app/services/fetchers/playwright_fetcher.py" = ["S110"]  # intentional try-except-pass on browser cleanup
"app/worker/tasks/fetch_task.py" = ["S110", "ASYNC240"]  # intentional try-except-pass on Redis close during shutdown; pathlib in startup check is intentional
"app/worker/arq_worker.py" = ["RUF012"]  # mutable class attribute required by arq WorkerSettings
"app/worker/browser_pool.py" = ["ASYNC240", "S311"]  # pathlib in startup check is intentional; random for viewport (non-crypto)
"app/api/v1/endpoints/jobs.py" = ["S110"]  # intentional try-except-pass on OTel span trace_id
"app/services/warc/dlq.py" = ["S110", "ASYNC230", "ASYNC240"]  # disk I/O inherent to DLQ

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
# Incremental hardening: full `strict` would fail on the current untyped code.
# Each roadmap step tightens this section further.
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "bs4.*",
    "camoufox.*",
    "curl_cffi.*",
    "html2text.*",
    "testcontainers.*",
    "sqlalchemy.*",
    "asyncpg.*",
    "argon2.*",
    "playwright.*",
    "redis.*",
    "httpx.*",
    "lxml.*",
    "starlette.*",
    "tldextract.*",
    "warcio.*",
    "aioboto3.*",
    "arq.*",
    "structlog.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "brotli",
    "zstandard",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.services.session_manager",
    "app.services.job_service",
    "app.services.proxy_health",
    "app.services.proxy_manager",
    "app.services.archive_reader",
]
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "app.services.storage",
    "app.services.webshare_sync",
]
disable_error_code = ["return-value", "arg-type", "assignment"]

[[tool.mypy.overrides]]
module = [
    "app.api.v1.endpoints.batches",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "app.services.warc.*",
    "app.services.job_service",
    "app.api.v1.endpoints.jobs",
    "app.services.batch_service",
    "app.core.observability",
]
warn_return_any = false
disable_error_code = ["return-value", "func-returns-value", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires Docker (testcontainers)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
